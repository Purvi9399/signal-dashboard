# Behavior Analytics: machine-readable question contract.
# Loaded by collector/cops/runtime/cop_package.py and validated by
# tests/test_cop_package_behavior_analytics.py. The Markdown files beside it
# explain this file; where they differ, this file is what the runtime uses.
#
# Build order: the eleventh COP packaged (COP 11 of the per-COP verification, approved by purvi 2026-11-27). The
# workbook and docs/cops/cop_catalogue.json number Behavior Analytics 12; their numbering is not a build order.

cop: behavior_analytics
contract: cop_metrics/1
version: 2026-11-27.1

sources:
  questions: >-
    BA-1 to BA-4: COPS- implementation 1.xlsx, sheet COMPLETE_DELEGATION_DATA, rows 181, 183, 185, 187
    (behavioural question row 181, column 2: "What behavioural patterns characterize the agent over time?");
    field lists in column 4 of each row; external data in column 5 of rows 183 to 187; metric list row 190 (37
    metrics). Inputs, tools and authority: sheet agents-harness row 16 ("Behavioral metric patterns across
    sessions, sequences, agent/task context"; "Baseline/history reader, pattern analysis, path/trace retrieval";
    "Observe, classify, record, pass. No enforcement from behavioral characterization alone"; "Avoid
    overgeneralizing from sparse history. Monitor stability, pattern drift, coverage"; "Gather behavior features
    -> compare history -> characterize pattern -> validate -> pass"). Sheet1 rows 20 (patterns: loops,
    escalation, poor recovery, unnecessary exploration, task drift; "Derived from pattern persistence, deviation
    and consequence"), 74 ("Rules. Examines execution sequences for loops, drift and poor recovery") and 91 (tools
    compute_sequence_statistics, compare_behaviour_history). many-to-many mapping row 17 ("What behavioural
    patterns are emerging over time?"; action WATCH). cops/specs.py keeps its own wording ("What behavioural
    pattern best characterizes this execution or sequence of executions?"), unchanged.
  metric_mapping: >-
    COPS_METRIC_MAPPING.md, sha256 5bd3c16f1ba26b297644259faaedfe75c1f219980e5c046a9bb56308c38e951e
    (collector/metric_registry.json, consumers = behavior_analytics: 37 metrics; 20 category E,
    IMPLEMENTED_EXISTING; 4 category S and 3 category H IMPLEMENTED in the opt-in catalogue with no approved
    threshold; 10 NOT_IMPLEMENTED: 1 category S, 6 category H, 1 category M, 1 category Q, 1 category O). The
    document lists the metrics per COP, not per question: each is assigned to the question its meaning answers
    (D-BA2). behavior_investigation_prioritya is spelled as in the registry (a suspected typo, U-BA9).
  rule: >-
    cops/runtime/rules.py behavior_analytics (no RuleInterpreter method), wrapped by _with_pattern_persistence,
    in this order: insights.retry and insights.failed both EXCEPTION or CRITICAL is POOR_RECOVERY 0.8 MEDIUM
    WATCH; insights.repetition or insights.retry EXCEPTION or CRITICAL is LOOPING 0.75 WATCH (severity from the
    worst state); a verified Context & Memory CONTEXT_LOSS or CONTRADICTORY, or Workflow Orchestration DRIFTING or
    UNEXPECTED_BRANCH, is DRIFTING 0.6 LOW WATCH; nothing judged is INCONCLUSIVE WATCH; otherwise STABLE 0.75
    NONE. Confidence is scaled by the upstream evidence confidence (min(1, evidence_conf / 0.9)). OVER_EXPLORING is
    unreachable (exploration_rate is not computed). The wrapper records Anomaly Detection's earlier-cycle verified
    finding as pattern_persistence; it changes nothing.
  labels: >-
    cops/specs.py interpretations: STABLE, LOOPING, DRIFTING, OVER_EXPLORING, POOR_RECOVERY. permitted_actions:
    NONE, WATCH (cops/authority.py tiers OBSERVE, RECORD). profiles.DETERMINISTIC_COPS: decided by rules, no
    model.

mapping:
  insights.repetition: {used_by: [BA-1]}
  insights.retry: {used_by: [BA-1]}
  insights.failed: {used_by: [BA-1]}
  insights.stalled: {used_by: [BA-1]}
  insights.reverted: {used_by: [BA-1]}
  insights.blocked: {used_by: [BA-1]}
  interaction.subagent_lanes: {used_by: [BA-1]}
  interaction.mcp_servers: {used_by: [BA-1]}
  telemetry.turn_linkage: {used_by: [BA-1]}
  telemetry.lane_linkage: {used_by: [BA-1]}
  telemetry.unknown_share: {used_by: [BA-1]}
  behavior_action_sequence_frequency:
    used_by: [BA-1]
    note_reported: >-
      IMPLEMENTED catalogue metric with no approved threshold (state NO_THRESHOLD): its value is reported, never
      judged.
  behavior_tool_usage_distribution:
    used_by: [BA-1]
    note_reported: >-
      IMPLEMENTED catalogue metric with no approved threshold (state NO_THRESHOLD): its value is reported, never
      judged.
  behavior_tool_transition_frequency:
    used_by: [BA-1]
    note_reported: >-
      IMPLEMENTED catalogue metric with no approved threshold (state NO_THRESHOLD): its value is reported, never
      judged.
  behavior_execution_pattern_frequency:
    used_by: [BA-1]
    note: >-
      NOT_CALCULATED. Registry category S, NOT_IMPLEMENTED, with no definition: which execution patterns are
      counted is not defined. BA-1 lists the sequence measures above instead.
  insights.token_outlier: {used_by: [BA-2]}
  insights.duration_outlier: {used_by: [BA-2]}
  activity.action_rate_ratio: {used_by: [BA-2]}
  path.transition_novelty: {used_by: [BA-2]}
  access.first_seen_mcp: {used_by: [BA-2]}
  insights.outside: {used_by: [BA-2]}
  behavior_historical_deviation_score:
    used_by: [BA-2]
    note: >-
      NOT_CALCULATED. Registry category H, NOT_IMPLEMENTED, with no definition. Missing input (workbook row 183
      column 5): historical behavioural baselines. BA-2 reads the approved estate- and tool-relative metrics and
      reports this agent's earlier values (compare_behaviour_history) instead; no score is approximated.
  behavior_peer_deviation_score:
    used_by: [BA-2]
    note: >-
      NOT_CALCULATED. Registry category H, NOT_IMPLEMENTED, with no definition. Missing inputs (row 183 column 5):
      comparable task categories, agent cohorts and model-specific baselines. No peer comparison is made.
  oversight.fast_approvals: {used_by: [BA-3]}
  oversight.declined_inferred: {used_by: [BA-3]}
  insights.no_oversight: {used_by: [BA-3]}
  behavior_repetition_trend:
    used_by: [BA-3]
    note_reported: >-
      IMPLEMENTED catalogue metric (least-squares slope over this operator's sessions with this tool) with no
      approved threshold (state NO_THRESHOLD): its value is reported, never judged. No slope threshold is invented.
  behavior_retry_trend:
    used_by: [BA-3]
    note_reported: >-
      IMPLEMENTED catalogue metric with no approved threshold (state NO_THRESHOLD): reported, never judged.
  behavior_failure_trend:
    used_by: [BA-3]
    note_reported: >-
      IMPLEMENTED catalogue metric with no approved threshold (state NO_THRESHOLD): reported, never judged.
  behavior_approval_pattern_trend:
    used_by: [BA-3]
    note: >-
      NOT_CALCULATED. Registry category H, NOT_IMPLEMENTED, with no definition. Missing input (row 185 column 5):
      historical approval frequencies. BA-3 reads oversight.fast_approvals against this agent's earlier sessions
      instead.
  behavior_pattern_persistence:
    used_by: [BA-3]
    note: >-
      NOT_CALCULATED. Registry category H, NOT_IMPLEMENTED, with no definition. Missing inputs (row 185 column 5):
      time-window definitions and persistence thresholds. No pattern is called persistent (D-BA7, U-BA3).
  behavior_change_point_score:
    used_by: [BA-3]
    note: >-
      NOT_CALCULATED. Registry category H, NOT_IMPLEMENTED, with no definition; no change-point method or
      threshold is approved.
  behavior_pattern_stability:
    used_by: [BA-3]
    note: >-
      NOT_CALCULATED. Registry category H, NOT_IMPLEMENTED, with no definition; needs the same window and threshold
      as behavior_pattern_persistence.
  behavior_model_variation:
    used_by: [BA-4]
    note_reported: >-
      IMPLEMENTED catalogue metric (distinct models in the session) with no approved threshold (state
      NO_THRESHOLD): reported, never judged.
  behavior_task_variation:
    used_by: [BA-4]
    note: >-
      NOT_CALCULATED. Registry category M, NOT_IMPLEMENTED. Missing inputs (row 187 column 5): task classification
      and task complexity.
  behavior_context_variation:
    used_by: [BA-4]
    note: >-
      NOT_CALCULATED. Registry category Q, NOT_IMPLEMENTED. Missing input (row 187 column 5): operating-context
      metadata and comparable historical execution records.
  behavior_investigation_prioritya:
    used_by: [BA-4]
    note: >-
      NOT_CALCULATED as a metric. Registry category O, NOT_IMPLEMENTED: a decision field of the consuming COP, not
      a calculated metric (registry note). Spelled as in the registry (U-BA9).

# cops/specs.py missing_metrics for this COP. None is computed or approximated.
not_calculated:
  loop_score_per_lane: >-
    NOT_CALCULATED. No registry metric. BA-1 reads insights.repetition and insights.retry for the session and lists
    subagent lanes; no per-lane loop score is computed.
  exploration_rate: >-
    NOT_CALCULATED. No registry metric. OVER_EXPLORING stays unreachable, as in the legacy rule
    (path.transition_novelty is a novelty measure for BA-2, not an exploration rate).
  planning_deviation: >-
    NOT_CALCULATED. No registry metric. A plan deviation is Workflow Orchestration's finding, read in BA-4.
  recovery_pattern: >-
    NOT_CALCULATED. No registry metric. BA-1 reads retries of failed commands (insights.retry with
    insights.failed), as the legacy rule does.

# Consumed COPs (specs.CONSUMES["behavior_analytics"]) and the previous-cycle feedback edge (specs.FEEDBACK).
# Runtime Monitoring is evidence quality. Context & Memory and Workflow Orchestration are the legacy rule's
# authorised integrity reads: a verified finding in these labels is what DRIFTING rests on (BA-4). Anomaly
# Detection's earlier-cycle verified finding is context for persistence and never an occurrence (D-BA9).
upstream:
  runtime_monitoring: {quality: [INSUFFICIENT, PARTIAL], quiet: [SUFFICIENT]}
  context_memory: {altered: [CONTEXT_LOSS, CONTRADICTORY], quiet: [CONTEXT_OK]}
  workflow_orchestration: {altered: [DRIFTING, UNEXPECTED_BRANCH], quiet: [NORMAL]}
feedback:
  anomaly_detection: {context: [ANOMALOUS], quiet: [NORMAL]}

# The pattern metrics: cops/specs.py metric_keys. These are what a behavioural pattern rests on.
pattern_metrics: [insights.repetition, insights.retry, insights.failed, insights.stalled, oversight.fast_approvals]
# Workload measures (estate- and tool-relative, BA-2): a deviation here alone is a workload reading, not a pattern.
workload_metrics: [insights.token_outlier, insights.duration_outlier, activity.action_rate_ratio]

questions:
  BA-1:
    question: What are the agent's typical action sequences, tool-use patterns and execution behaviours?
    fields: [observable_id, observable_type, session_id, turn_id, agent_id, agent_type, tool_use_id, tool_name,
             tool_category, tool_arguments, tool_result, tool_duration_ms, command, loop_count, turn_count,
             batch_size, success, status, error_type, stop_reason, raw_ref]
    requires:
      - {metric: insights.repetition, kind: REQUIRED}
      - {metric: insights.retry, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: insights.failed, kind: REQUIRED}
      - {metric: insights.stalled, kind: REQUIRED}
      - {metric: insights.reverted, kind: OPTIONAL}
      - {metric: insights.blocked, kind: OPTIONAL}
      - {metric: interaction.subagent_lanes, kind: OPTIONAL}
      - {metric: interaction.mcp_servers, kind: OPTIONAL}
      - {metric: telemetry.turn_linkage, kind: OPTIONAL}
      - {metric: telemetry.lane_linkage, kind: OPTIONAL}
      - {metric: telemetry.unknown_share, kind: OPTIONAL}
      - {metric: behavior_action_sequence_frequency, kind: OPTIONAL}
      - {metric: behavior_tool_usage_distribution, kind: OPTIONAL}
      - {metric: behavior_tool_transition_frequency, kind: OPTIONAL}
      - {metric: behavior_execution_pattern_frequency, kind: OPTIONAL}
    verified: []
    blocking: []
    outcomes: [RETRY_AFTER_FAILURE, REPEATED_ACTIONS, WORKLOAD_ONLY, NO_PATTERN]

  BA-2:
    question: How does its current behaviour compare with its own historical behaviour and comparable agents?
    fields: [observable_id, observable_type, session_id, agent_id, agent_type, model, model_id, operator_id, org_id,
             team_id, prompt_text, composer_mode, tool_name, tool_category, tool_duration_ms, latency_ms,
             request_latency_ms, input_tokens, output_tokens, total_tokens, cost_usd, loop_count, turn_count,
             success, status, error_type, raw_ref]
    requires:
      - {metric: insights.token_outlier, kind: OPTIONAL}
      - {metric: insights.duration_outlier, kind: OPTIONAL}
      - {metric: activity.action_rate_ratio, kind: OPTIONAL}
      - {metric: path.transition_novelty, kind: OPTIONAL}
      - {metric: access.first_seen_mcp, kind: OPTIONAL}
      - {metric: insights.outside, kind: OPTIONAL}
      - {metric: behavior_historical_deviation_score, kind: OPTIONAL}
      - {metric: behavior_peer_deviation_score, kind: OPTIONAL}
    verified: []
    blocking: []
    outcomes: [OUTSIDE_USUAL_RANGE, WITHIN_USUAL_RANGE]

  BA-3:
    question: Are repeated actions, retries, failures or approval patterns becoming persistent behavioural tendencies?
    fields: [observable_id, observable_type, session_id, turn_id, agent_id, tool_use_id, tool_name, tool_arguments,
             tool_result, command, loop_count, turn_count, success, status, error_type, error_message, exit_code,
             permission_mode, permission_decision, permission_source, permission_scope, denial_reason,
             escalation_flag, violation_count, raw_ref]
    requires:
      - {metric: oversight.fast_approvals, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: oversight.declined_inferred, kind: OPTIONAL}
      - {metric: insights.no_oversight, kind: OPTIONAL}
      - {metric: behavior_repetition_trend, kind: OPTIONAL}
      - {metric: behavior_retry_trend, kind: OPTIONAL}
      - {metric: behavior_failure_trend, kind: OPTIONAL}
      - {metric: behavior_approval_pattern_trend, kind: OPTIONAL}
      - {metric: behavior_pattern_persistence, kind: OPTIONAL}
      - {metric: behavior_change_point_score, kind: OPTIONAL}
      - {metric: behavior_pattern_stability, kind: OPTIONAL}
    verified: []
    blocking: []
    depends_on: [BA-1, BA-2]
    outcomes: [ISOLATED, RECURRING, WORSENING, NO_CURRENT_PATTERN]

  BA-4:
    question: How does behaviour vary across tasks, sessions, models and operating contexts?
    fields: [observable_id, observable_type, session_id, turn_id, agent_id, agent_type, parent_agent_id,
             is_multi_agent, multi_agent_source, delegation_depth, model, model_id, prompt_text, prompt_length,
             composer_mode, slash_command, plan_item, plan_status, workspace, repo_name, git_branch, tool_name,
             tool_category, tool_arguments, tool_duration_ms, input_tokens, output_tokens, total_tokens, cost_usd,
             turn_count, loop_count, success, status, error_type, raw_ref]
    requires:
      - {metric: behavior_model_variation, kind: OPTIONAL}
      - {metric: behavior_task_variation, kind: OPTIONAL}
      - {metric: behavior_context_variation, kind: OPTIONAL}
      - {metric: behavior_investigation_prioritya, kind: OPTIONAL}
    verified: []
    blocking: []
    outcomes: [CONTEXT_ALTERED, NO_ALTERATION_SHOWN]

# BA-1 and BA-4 give the pattern (the label), in the legacy rule's order: RETRY_AFTER_FAILURE -> POOR_RECOVERY;
# REPEATED_ACTIONS -> LOOPING; else BA-4 CONTEXT_ALTERED -> DRIFTING; else NO_PATTERN or WORKLOAD_ONLY -> STABLE;
# BA-1 unanswered -> INCONCLUSIVE. BA-2 and BA-3 give the scope the label is published with: how the execution
# compares with the agent's usual range, and whether the pattern is isolated to this execution, recurring across
# distinct sessions or worsening across consecutive sessions (D-BA5 to D-BA8). Severity and confidence are the
# legacy rule's.
labels:
  RETRY_AFTER_FAILURE: POOR_RECOVERY
  REPEATED_ACTIONS: LOOPING
  CONTEXT_ALTERED: DRIFTING
  WORKLOAD_ONLY: STABLE
  NO_PATTERN: STABLE
  INCONCLUSIVE: INCONCLUSIVE

severity:
  POOR_RECOVERY: MEDIUM
  LOOPING: from_state
  DRIFTING: LOW
  STABLE: NONE
  INCONCLUSIVE: NONE

confidence:
  POOR_RECOVERY: 0.8
  LOOPING: 0.75
  DRIFTING: 0.6
  STABLE: 0.75
  INCONCLUSIVE: 0.0

responses:
  POOR_RECOVERY: WATCH
  LOOPING: WATCH
  DRIFTING: WATCH
  STABLE: NONE
  INCONCLUSIVE: WATCH

# No model: every reading is decided by the package (profiles.DETERMINISTIC_COPS; Sheet1 row 74 "Rules").
model_role: none

# Metric states that count as observed (rules.HOT). WARNING does not count.
deviation_states: [EXCEPTION, CRITICAL]
state_rank: {NORMAL: 0, WARNING: 1, EXCEPTION: 2, CRITICAL: 3}

operations:
  compute_metrics: {by: deterministic, code: collector/signal_metrics.py:compute}
  sequence_statistics: {by: deterministic, code: collector/cops/runtime/tools.py:t_compute_sequence_statistics}
  behaviour_history: {by: deterministic, code: collector/cops/runtime/tools.py:t_compare_behaviour_history}
  assess_evidence: {by: deterministic, code: collector/cops/runtime/evidence_assessment.py:assess}
  observe_questions: {by: deterministic, code: collector/cops/runtime/cop_package.py:observe_behavior_analytics}
  decide_label: {by: deterministic, code: collector/cops/runtime/cop_package.py:decide_behavior_analytics}
  verify_finding: {by: deterministic, code: collector/cops/runtime/verifiers.py}
  select_action: {by: deterministic, code: collector/cops/runtime/triage.py}
  authority_check: {by: deterministic, code: collector/cops/authority.py:check}
  memory_write: {by: deterministic, code: collector/cops/runtime/graph.py:validate_memory_update}
  decision_record: {by: deterministic, code: collector/cops/runtime/decision.py:build}
