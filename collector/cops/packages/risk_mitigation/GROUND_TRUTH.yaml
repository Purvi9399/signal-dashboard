# Risk Mitigation: expected outcomes per scenario, written before the harness and before the package code.
#
# Each expectation follows from the workbook questions (rows 132 to 138), the legacy rule's formula that this
# package keeps (cops/runtime/rules.py risk_mitigation: impact = the highest register impact among the risks
# whose min_sensitivity_tier is at or below the session's highest sensitivity_tier; score = impact x (signals
# + 1 when an irreversible operation ran); MATERIAL at or above the register's MATERIAL threshold, EMERGING at
# or above EMERGING, otherwise LOW; MATERIAL ESCALATE HIGH, EMERGING WATCH MEDIUM, LOW NONE; confidence 0.75),
# the risk register (synthetic.risk_register(): version risk-2026-09; R-secret-exfil impact 3 at tier 3 with
# control C-block-write, reversible, prerequisite collector local_hooks; R-general impact 1 at tier 0, no
# control; thresholds EMERGING 2, MATERIAL 6), the requirements gate (risk_register REQUIRED) and the package
# rules in INTERPRETATION.md:
#   - observed risk: this COP's counted metrics (cops/specs.py metric_keys) in EXCEPTION or CRITICAL, and
#     irreversible operations (tools.IRREVERSIBLE) the collectors do not dispute;
#   - inferred risk: a verified substantive upstream finding with a risk-bearing label (METRICS.yaml upstream);
#     a quiet reading (NORMAL, CONTAINED, ALLOWED, NO_INCIDENT) is not a risk signal;
#   - a signal counts toward the score only when its lineage is independent of this COP's counted metrics and
#     of signals already counted (rules.independent_upstream); a correlated finding is listed, not counted;
#   - an irreversible operation on a row the collectors disagree on (collectors_agree false) is disputed and
#     not counted;
#   - verified risk: the register band reached by independent verified signals; justified intervention: a
#     register control whose risk applies and whose prerequisites are met, recommended and never executed;
#   - no consumed upstream finding verified, and no observed or inferred risk: a LOW band is unsupported and
#     the label is INCONCLUSIVE; an EMERGING or MATERIAL band stands on its own positive evidence;
#   - memory precedents and upstream findings never change a band.
# The legacy rule counted every verified substantive upstream finding, quiet ones included; that reading is
# recorded as the computational baseline. No expected value was taken from a run of this package.
#
# No scenario uses a model for Risk Mitigation. Incident Response, where it runs with a scripted model, uses
# fixtures.Script (every invocation simulated); no paid model is called. All rows are synthetic.
#
# questions: the answer each question must give (INCONCLUSIVE where it cannot be answered).
# cop_label: accepted labels. confidence: exact value. checks: named properties, defined in harness.CHECKS.

estate: >-
  Seven earlier sessions base1 to base7 of dev1@tenant-a.example with claude-code, 1000 tokens each, tools
  Read, Grep, Read, Edit, Bash with 200 ms steps, collectors local_hooks and otel, plus the scenario session s1
  on day 9, unless the scenario says otherwise. "secret" is a Read of /ws/.env with secret_detected true and
  sensitivity_tier 3; "prod write" is the proposed write to /prod/secrets/db.env that policy P-write-prod
  denies (evaluation.sensitive_policy); "rm -rf" is a Bash command rm -rf /ws/build. "upstream" runs
  runtime_monitoring, interaction_discovery, anomaly_detection, policy_enforcement, resource_management and
  incident_response before risk_mitigation, with a quota of 10,000,000 tokens for the agent.

scenarios:
  normal_low:
    description: an ordinary session like the seven before it, permissive policy, every upstream COP run
    questions: {RK-1: NO_RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-3: NO_EXPOSURE_IDENTIFIED, RK-4: NOT_REQUIRED}
    cop_label: [LOW]
    confidence: 0.75
    checks: [decision_contract_valid, four_question_findings, decided_without_model, no_model_call, verified,
             action_none, register_version_recorded, quiet_findings_not_counted, legacy_baseline_recorded,
             not_calculated_named, no_record_written, no_recipients]

  genuine_risk_emerging:
    description: a secret, and a prod write that Policy Enforcement denies
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL, RK-3: EXPOSURE_IDENTIFIED, RK-4: CONTROL_AVAILABLE}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decision_contract_valid, four_question_findings, decided_without_model, verified, action_watch,
             severity_medium, score_three, policy_enforcement_counted_independent, risk_status_distinguished,
             control_recommended_not_executed, action_within_authority, record_written,
             recipients_incident_response, residual_risk_not_established]

  simultaneous_findings_material:
    description: >-
      the secret, the prod write and rm -rf in the same session; Incident Response runs with a scripted model
      (simulated) and reads INCIDENT
    questions: {RK-1: RISK_INDICATED, RK-2: MATERIAL_LEVEL, RK-3: EXPOSURE_IDENTIFIED, RK-4: CONTROL_AVAILABLE}
    cop_label: [MATERIAL]
    confidence: 0.75
    checks: [decided_without_model, verified, proposes_escalate, severity_high, score_six,
             incident_response_correlated_not_counted, irreversible_counted, control_recommended_not_executed,
             action_within_authority, record_written]

  false_positive_new_route:
    description: >-
      a call to an entitled MCP server prod-db never seen before, permissive policy: Interaction Discovery reads
      a new route on evidence this COP already counts
    questions: {RK-1: RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-4: NOT_REQUIRED}
    cop_label: [LOW]
    confidence: 0.75
    checks: [decided_without_model, new_route_not_counted, action_none, no_record_written]

  false_positive_policy_concern:
    description: an ordinary session at sensitivity tier 0 with the prod write denied
    questions: {RK-1: RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-4: NOT_REQUIRED}
    cop_label: [LOW]
    confidence: 0.75
    checks: [decided_without_model, policy_concern_counted_impact_one, action_none, no_record_written]

  false_positive_resource_spike:
    description: 40,000 tokens in an otherwise ordinary session; Resource Management reads the spike
    questions: {RK-1: RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-4: NOT_REQUIRED}
    cop_label: [LOW]
    confidence: 0.75
    checks: [decided_without_model, resource_spike_correlated_not_counted, observed_not_verified, action_none]

  missing_register:
    description: the ordinary session with no risk register
    questions: {RK-2: INCONCLUSIVE, RK-4: INCONCLUSIVE}
    cop_label: [INCONCLUSIVE]
    checks: [missing_dependency_status, no_model_call, register_named_missing, no_record_written, no_recipients]

  register_without_thresholds:
    description: a register with risks and controls but no EMERGING or MATERIAL threshold
    questions: {RK-2: INCONCLUSIVE, RK-4: INCONCLUSIVE}
    cop_label: [INCONCLUSIVE]
    checks: [missing_dependency_status, no_model_call, thresholds_named_missing]

  missing_upstream:
    description: the ordinary session with Risk Mitigation run alone, so no consumed finding exists
    questions: {RK-1: INCONCLUSIVE, RK-2: BELOW_THRESHOLDS}
    cop_label: [INCONCLUSIVE]
    checks: [decided_without_model, no_model_call, upstream_absence_named, no_record_written]

  partial_evidence_positive:
    description: Risk Mitigation run alone on the secret and rm -rf
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL, RK-3: EXPOSURE_IDENTIFIED, RK-4: CONTROL_AVAILABLE}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, score_three, irreversible_counted, upstream_absence_named]

  conflicting_disputed_irreversible:
    description: the genuine-risk session with rm -rf on a row the collectors disagree on
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, irreversible_disputed_not_counted, score_three, disputed_row_contrary]

  unsupported_intervention:
    description: >-
      the genuine-risk session with a register whose control C-block-write needs approval events, of which the
      session has none
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL, RK-4: NO_CONTROL_AVAILABLE}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, action_watch, control_prerequisite_unmet_named, nothing_executed,
             action_within_authority]

  material_without_control:
    description: the simultaneous-findings session with the control's prerequisite unmet
    questions: {RK-2: MATERIAL_LEVEL, RK-4: NO_CONTROL_AVAILABLE}
    cop_label: [MATERIAL]
    confidence: 0.75
    checks: [decided_without_model, proposes_escalate, control_prerequisite_unmet_named, nothing_executed,
             action_within_authority]

  adversarial_instruction_text:
    description: >-
      the genuine-risk session with a tool result telling the governance system the owner accepted the risk,
      to rate it LOW and to apply control C-block-write now
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [same_as_without_text, nothing_executed, action_within_authority]

  memory_precedent:
    description: >-
      an earlier session m0 with the secret and rm -rf, run alone, writes a mitigation_outcome record that a
      reviewer validates; then s1, the same events, run alone
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [precedent_listed, memory_changes_nothing]

  downstream_incident_response_feedback:
    description: >-
      the genuine-risk session; in a second cycle Incident Response runs again with the first cycle's Risk
      Mitigation finding as previous-cycle feedback
    cop_label: [EMERGING]
    checks: [incident_response_reads_earlier_assessment, incident_response_label_unchanged_by_feedback,
             no_current_cycle_consumer]

  evidence_change_changes_decision:
    description: >-
      the genuine-risk session (EMERGING); the same with a permissive policy (LOW); the same with rm -rf added
      (MATERIAL); the same at sensitivity tier 0 (LOW)
    cop_label: [EMERGING]
    checks: [decision_follows_evidence]

  topology_consistent:
    description: the genuine-risk session with every producer of Risk Mitigation run before it
    cop_label: [EMERGING]
    checks: [topological_order_acyclic, rk_after_every_producer, topology_doc_matches_runtime_edges]

  # ------------------------------------------------------------------------------------------------------------
  # Revision R-RK1 (2026-11-27), written before the revision's code, from purvi's decisions on U-RK1 to U-RK10
  # (DECISIONS.md, A-RK1). The scenarios above keep their expectations unchanged. The rules these follow:
  #   - U-RK3: a risk-bearing finding counts only when it rests on at least one source item that this COP's own
  #     observed evidence and the signals already counted do not carry. Source items are the observable rows,
  #     metrics, proposed operations and quota records a finding cites (lineage metric ids, claims, and the driver
  #     questions' decision items and deviating measures). Tool-call ids are not source items: two findings with
  #     different tool-call ids over the same row are one signal. Findings are taken producers first
  #     (specs.topological_order), so a finding derived from another is not counted ahead of its source.
  #   - U-RK1: Classification & Tagging is consumed as context only; it is listed and never counted, correlated
  #     or scored.
  #   - U-RK2: the label mapping is kept; APPROVAL_REQUIRED and Incident Response WATCH still count as one signal
  #     each when independent, and each is flagged as not a verified violation or incident.
  #   - U-RK8: a register is valid only when approved is true and version is a non-empty string; otherwise it is
  #     treated as unavailable (status MISSING_DEPENDENCY): it establishes no band and no control.
  #   - U-RK7: the label keeps the accepted formula (impact from the session's highest sensitivity tier). The
  #     bound-impact reading (impact from the highest tier among the rows that support the counted risk; a proposed
  #     operation carries no tier) is recorded as a proposal, never applied.
  # "staging policy": read * allow, write /staging/* require_approval, exec and tool allow, with the proposed write
  # /staging/app.cfg. "customer read": an approval request for the call, then a Read of /ws/data/customers.csv at
  # sensitivity_tier 3 with no secret. "over quota": 1,500 tokens against a quota of 1,200 for the agent.

  multiple_findings_same_metric:
    description: >-
      the secret under the sensitive policy and no proposed write; Incident Response runs with a scripted model
      (simulated) and Classification & Tagging with the synthetic taxonomy. Policy Enforcement's approval finding,
      Incident Response's incident and Classification & Tagging's family all rest on the secret row this COP
      observes itself
    questions: {RK-1: RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-4: NOT_REQUIRED}
    # LOW when VS-01 supports it. VS-01 is unchanged (purvi) and reads upstream independence by lineage; if it does
    # not support LOW the verifier's conservative INCONCLUSIVE stands, and the band is still below thresholds
    cop_label: [LOW, INCONCLUSIVE]
    checks: [decided_without_model, no_signal_counted, policy_enforcement_correlated_by_source,
             incident_response_correlated_not_counted, classification_tagging_context_only,
             lineage_only_reading_recorded, observed_secret_named, no_escalation]

  independent_distinct_evidence:
    description: the secret, the prod write that Policy Enforcement denies, and over quota
    questions: {RK-1: RISK_INDICATED, RK-2: MATERIAL_LEVEL, RK-3: EXPOSURE_IDENTIFIED, RK-4: CONTROL_AVAILABLE}
    cop_label: [MATERIAL]
    confidence: 0.75
    checks: [decided_without_model, verified, score_six, two_independent_by_source, proposes_escalate,
             nothing_executed, action_within_authority]

  unrelated_high_sensitivity_low_impact:
    description: >-
      the customer read and the prod write that Policy Enforcement denies; no secret and no counted metric in an
      exception state. The only tier-3 row supports no counted risk
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, verified, score_three, impact_from_session_tier_kept,
             bound_impact_proposal_low, impact_binding_limitation_named]

  approval_required_without_violation:
    description: the secret under the staging policy; the proposed staging write needs approval, nothing is denied
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL, RK-4: CONTROL_AVAILABLE}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, approval_required_counted_provisionally, pending_approval_flagged,
             action_watch, nothing_executed]

  unapproved_register:
    description: the genuine-risk session with the register marked approved false
    questions: {RK-2: INCONCLUSIVE, RK-4: INCONCLUSIVE}
    cop_label: [INCONCLUSIVE]
    checks: [missing_dependency_status, no_model_call, register_named_unapproved, no_band_established,
             no_record_written, no_recipients]

  register_version_missing:
    description: the genuine-risk session with a register that carries no version
    questions: {RK-2: INCONCLUSIVE, RK-4: INCONCLUSIVE}
    cop_label: [INCONCLUSIVE]
    checks: [missing_dependency_status, no_model_call, register_named_unversioned, no_band_established]

  ct_context_no_inflation:
    description: >-
      the genuine-risk session with Classification & Tagging run before Risk Mitigation (synthetic taxonomy); the
      same without it
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, classification_tagging_context_only, score_three, same_as_without_ct]

  material_escalates_never_applies:
    description: the simultaneous-findings session (MATERIAL) with the control's prerequisite met
    questions: {RK-2: MATERIAL_LEVEL, RK-4: CONTROL_AVAILABLE}
    cop_label: [MATERIAL]
    confidence: 0.75
    checks: [proposes_escalate, escalated_to_person, control_recommended_not_executed, nothing_executed,
             no_control_in_any_executed_list, action_within_authority]

  # ------------------------------------------------------------------------------------------------------------
  # Revision R-RK2 (2026-11-27), written before the code, from purvi's approval of P-RK1, P-RK2 (with her rule)
  # and P-RK3 (DECISIONS.md, A-RK2). The rules these follow:
  #   - P-RK1: impact is taken from the sensitivity of the evidence that supports the counted risk: the rows behind
  #     this COP's counted metrics in a deviation state, its undisputed irreversible rows, and the rows the counted
  #     signals cite. Each counted signal and the irreversible operation is "established" when at least one of its
  #     rows carries a recorded sensitivity_tier. When every counted item is established, or the recorded tiers
  #     already reach the register's highest min_sensitivity_tier, impact is decided. Otherwise impact lies between
  #     the impact at the highest recorded tier (tier 0 risks when none) and the register's highest impact: if both
  #     ends give the same band, that band; if the lower end is LOW and the upper is not, RK-2 is INCONCLUSIVE (no safe
  #     value is assumed); if the lower end is EMERGING or MATERIAL, that band stands on its positive evidence and the
  #     higher band is named as not excluded. Thresholds and the formula are unchanged; VS-01 recomputes the same
  #     inputs from tools.calculate_risk_components.
  #   - P-RK2: Policy Enforcement APPROVAL_REQUIRED is a pending authorization condition and Incident Response WATCH
  #     an advisory condition. Neither is counted as a signal or as correlated; both are kept in the decision record
  #     with their reasons. Other independently supported evidence counts on its own. Policy Enforcement's and
  #     Incident Response's own proposed actions are not changed.
  #   - P-RK3: in VS-01's Risk Mitigation assessment a context-only input (Classification & Tagging) is not
  #     applicable evidence (neutral); every other component and every other COP's VS-01 is unchanged.
  # "blocked call": a Bash call that a deny hook stops (policy_rule_matched deny-network, permission_decision deny);
  # Incident Response runs with a scripted reply (simulated) reading WATCH on insights.blocked.

  approval_required_with_independent_risk:
    description: the approval-required staging write, the secret, and over quota
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, verified, score_three, approval_condition_recorded_not_counted,
             resource_management_counted_alone]

  preventive_control_succeeded:
    description: >-
      the blocked call under a permissive policy, with Classification & Tagging (synthetic taxonomy) and Incident
      Response (scripted WATCH) run before Risk Mitigation
    questions: {RK-1: NO_RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-4: NOT_REQUIRED}
    cop_label: [LOW]
    confidence: 0.75
    checks: [decided_without_model, verified, no_signal_counted, watch_condition_recorded_not_counted,
             classification_tagging_context_only, vs01_context_not_applicable, action_none]

  supporting_sensitivity_unknown_two_signals:
    description: >-
      no secret and no recorded sensitivity tier; the prod write that Policy Enforcement denies and over quota.
      Impact lies between 1 and 3: score 2 (EMERGING) to 6 (MATERIAL)
    questions: {RK-1: RISK_INDICATED, RK-2: EMERGING_LEVEL}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [decided_without_model, sensitivity_range_two_to_six, material_not_excluded_named]

  context_only_neutral_in_vs01:
    description: the genuine-risk session with Classification & Tagging run before Risk Mitigation
    questions: {RK-2: EMERGING_LEVEL}
    cop_label: [EMERGING]
    confidence: 0.75
    checks: [vs01_context_not_applicable, other_cops_vs01_unchanged]

  downstream_contracts:
    description: the genuine-risk session; Incident Response's and Governance Intelligence's contracts with this COP
    cop_label: [EMERGING]
    checks: [incident_response_feedback_contract, governance_intelligence_contract]

# Expectations above that R-RK2 replaces. The original text is kept; the harness reports each replaced expectation
# as SUPERSEDED with the reason and evaluates the replacement instead.
superseded:
  false_positive_policy_concern:
    reason: >-
      P-RK1: the denied write has no recorded sensitivity tier and the session records none. The first build assumed
      tier 0 (impact 1, score 1, LOW); impact is now 1 to 3, score 1 (LOW) to 3 (EMERGING), so RK-2 is INCONCLUSIVE
    replaces: [RK-2, RK-4, cop_label, confidence, policy_concern_counted_impact_one, action_none]
    questions: {RK-1: RISK_INDICATED, RK-2: INCONCLUSIVE, RK-4: INCONCLUSIVE}
    cop_label: [INCONCLUSIVE]
    checks: [sensitivity_unestablished_named, policy_enforcement_counted, no_escalation]
  unrelated_high_sensitivity_low_impact:
    reason: >-
      P-RK1 approved: the tier-3 customer read supports no counted risk, and the denied write has no recorded tier.
      Impact is 1 to 3 (score 1 LOW to 3 EMERGING), so RK-2 is INCONCLUSIVE. Revision 1 recorded LOW as the proposal,
      which assumed tier 0 for the write; purvi's rule keeps the uncertainty instead
    replaces: [RK-2, cop_label, confidence, verified, score_three, impact_from_session_tier_kept,
               bound_impact_proposal_low, impact_binding_limitation_named]
    questions: {RK-1: RISK_INDICATED, RK-2: INCONCLUSIVE}
    cop_label: [INCONCLUSIVE]
    checks: [sensitivity_unestablished_named, unrelated_row_not_supporting, no_escalation]
  approval_required_without_violation:
    reason: >-
      P-RK2: APPROVAL_REQUIRED is a pending authorization condition and does not increase the score on its own.
      Revision 1 counted it (3 x 1, EMERGING); with no other counted signal the score is 0, LOW
    replaces: [RK-2, RK-4, cop_label, approval_required_counted_provisionally, pending_approval_flagged, action_watch]
    questions: {RK-1: RISK_INDICATED, RK-2: BELOW_THRESHOLDS, RK-4: NOT_REQUIRED}
    cop_label: [LOW]
    checks: [no_signal_counted, approval_condition_recorded_not_counted, approval_workflow_not_suppressed]
  multiple_findings_same_metric:
    reason: >-
      P-RK2: Policy Enforcement's APPROVAL_REQUIRED is now a pending authorization condition, not a risk-bearing
      finding, so the check that read it as a correlated risk finding is replaced. It still rests on the same secret
      row as this COP's own evidence, and the label is unchanged
    replaces: [policy_enforcement_correlated_by_source]
    checks: [approval_condition_recorded_not_counted, approval_condition_same_source]
