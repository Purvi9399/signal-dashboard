# Interaction Discovery: machine-readable question contract.
# Loaded by collector/cops/runtime/cop_package.py and validated by
# tests/test_cop_package_interaction_discovery.py. The Markdown files beside it
# explain this file; where they differ, this file is what the runtime uses.

cop: interaction_discovery
contract: cop_metrics/1
version: 2026-11-20.2

sources:
  questions: >-
    ID-1 to ID-5: COPS- implementation 1.xlsx, sheet COMPLETE_DELEGATION_DATA, rows 43-47;
    metric list row 48.
  metric_mapping: >-
    COPS_METRIC_MAPPING.md, sha256 5bd3c16f1ba26b297644259faaedfe75c1f219980e5c046a9bb56308c38e951e
    (collector/metric_registry.json, consumers = interaction_discovery), plus the code-only pair
    insights.outside (metric_registry.json code_only_pairs).

mapping:
  interaction_unique_entities: {used_by: [ID-1]}
  interaction.subagent_lanes: {used_by: [ID-1, ID-4]}
  interaction.mcp_servers: {used_by: [ID-1, ID-4]}
  interaction_edge_count: {used_by: [ID-2, ID-3]}
  interaction_graph_completeness: {used_by: [ID-2]}
  interaction_orphaned_events: {used_by: [ID-2, ID-5]}
  telemetry.turn_linkage: {used_by: [ID-2]}
  telemetry.lane_linkage: {used_by: [ID-2]}
  interaction_route_novelty: {used_by: [ID-3]}
  access.first_seen_mcp: {used_by: [ID-3]}
  path.transition_novelty: {used_by: [ID-3]}
  interaction_propagation_depth: {used_by: [ID-4]}
  interaction_propagation_breadth: {used_by: [ID-4]}
  insights.outside: {used_by: [ID-4], code_only: true, note: observed in ID-4 and not judged (D17)}
  telemetry.collector_coverage: {used_by: [ID-5]}
  telemetry.unknown_share: {used_by: [ID-5]}
  telemetry.source_agreement: {used_by: [ID-5]}
  interaction_unattributed_edges:
    used_by: [ID-5]
    note: >-
      NOT_CALCULATED. Registry: "edges with attribution = unknown", definition to confirm, because the
      attribution column describes file effects, not interaction edges. Missing input: an approved
      definition of an unattributed interaction edge.

questions:
  ID-1:
    question: Which agents, subagents, tools and MCP servers are interacting during execution?
    fields: [observable_id, observable_type, session_id, agent_id, agent_type, parent_agent_id, is_multi_agent,
             multi_agent_source, delegation_depth, tool_use_id, tool_name, tool_category, tool_is_builtin,
             mcp_server, mcp_tool, mcp_transport, mcp_server_version, mcp_tools_available, raw_ref]
    requires:
      - {metric: interaction_unique_entities, kind: REQUIRED}
      - {metric: interaction.subagent_lanes, kind: REQUIRED}
      - {metric: interaction.mcp_servers, kind: OPTIONAL}
    verified: []
    blocking: []
    outcomes: [ENTITIES_IDENTIFIED, ENTITIES_PARTIALLY_IDENTIFIED]

  ID-2:
    question: Can we reconstruct the relationships and communication paths between these entities?
    fields: [observable_id, observable_type, session_id, turn_id, agent_id, agent_type, parent_agent_id,
             is_multi_agent, multi_agent_source, delegation_depth, tool_use_id, tool_name, tool_arguments,
             tool_result, tool_duration_ms, mcp_server, mcp_tool, mcp_transport, raw_ref]
    requires:
      - {metric: interaction_edge_count, kind: REQUIRED}
      - {metric: interaction_graph_completeness, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: interaction_orphaned_events, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: telemetry.lane_linkage, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: telemetry.turn_linkage, kind: REQUIRED_WHEN_APPLICABLE}
    verified: []
    blocking: [CONFLICTING_ACTION_SOURCES]
    outcomes: [FULLY_RECONSTRUCTED, PARTIALLY_RECONSTRUCTED, NOT_RECONSTRUCTABLE]

  ID-3:
    question: Have new or previously unseen interaction routes appeared?
    fields: [observable_id, observable_type, session_id, turn_id, agent_id, parent_agent_id, delegation_depth,
             tool_use_id, tool_name, tool_category, tool_is_builtin, mcp_server, mcp_tool, mcp_transport,
             mcp_server_version, mcp_tools_available, multi_agent_source, raw_ref]
    requires:
      - {metric: interaction_route_novelty, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: interaction_edge_count, kind: REQUIRED}
      - {metric: access.first_seen_mcp, kind: OPTIONAL}
      - {metric: path.transition_novelty, kind: OPTIONAL}
    verified: []
    blocking: []
    outcomes: [NEW_ROUTES_APPEARED, NO_NEW_ROUTES]

  ID-4:
    question: How deeply and widely is activity propagating across agents, tools and services?
    fields: [observable_id, observable_type, session_id, turn_id, agent_id, agent_type, parent_agent_id,
             is_multi_agent, multi_agent_source, delegation_depth, tool_use_id, tool_name, tool_category,
             tool_arguments, tool_result, batch_size, turn_count, mcp_server, mcp_tool, mcp_transport, raw_ref]
    requires:
      - {metric: interaction_propagation_depth, kind: REQUIRED}
      - {metric: interaction_propagation_breadth, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: interaction.subagent_lanes, kind: REQUIRED}
      - {metric: interaction.mcp_servers, kind: OPTIONAL}
      - {metric: insights.outside, kind: OPTIONAL}
    verified: []
    blocking: []
    outcomes: [WITHIN_APPROVED_BOUNDS, BEYOND_APPROVED_BOUNDS]

  ID-5:
    question: >-
      Are missing agent identities, lane links or interaction records preventing reliable
      reconstruction of the network?
    fields: [observable_id, observable_type, collector, session_id, turn_id, agent_id, agent_type,
             parent_agent_id, is_multi_agent, multi_agent_source, delegation_depth, tool_use_id, tool_name,
             tool_arguments, tool_result, status, success, error_type, mcp_server, mcp_tool, raw_ref]
    requires:
      - {metric: telemetry.collector_coverage, kind: REQUIRED}
      - {metric: telemetry.unknown_share, kind: REQUIRED}
      - {metric: telemetry.source_agreement, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: interaction_orphaned_events, kind: REQUIRED_WHEN_APPLICABLE}
      - {metric: interaction_unattributed_edges, kind: OPTIONAL}
    verified: []
    blocking: []
    depends_on: [ID-1, ID-2, ID-4]
    outcomes: [RECONSTRUCTION_RELIABLE, RECONSTRUCTION_IMPAIRED]

# Metric states that count as beyond the approved bounds in ID-4. They are the states
# cops/interpret.py:_interaction_discovery already used for PROPAGATING; the thresholds
# themselves are metrics_config.json's.
propagation_states: [EXCEPTION, CRITICAL]

# The measures ID-4 judges against their approved thresholds: how many agents and services activity
# reached (2026-11-20, D17). insights.outside is a workspace boundary, not propagation; ID-4 reports it as
# an observation for Policy Enforcement, which reads the same metric, and does not judge it.
propagation_measures: [interaction.subagent_lanes, interaction.mcp_servers]
boundary_observations:
  insights.outside: {owner: policy_enforcement, why: file work outside the workspace, a workspace boundary}

operations:
  compute_metrics: {by: deterministic, code: collector/signal_metrics.py:compute}
  assess_evidence: {by: deterministic, code: collector/cops/runtime/evidence_assessment.py:assess}
  build_graph: {by: deterministic, code: collector/cops/runtime/tools.py:t_build_interaction_graph}
  known_routes: {by: deterministic, code: collector/cops/runtime/tools.py:t_compare_known_routes}
  observe_questions: {by: deterministic, code: collector/cops/runtime/cop_package.py:observe_interaction_discovery}
  cop_label: {by: deterministic, code: collector/cops/runtime/cop_package.py:decide_interaction_discovery}
  verify_finding: {by: deterministic, code: collector/cops/runtime/verifiers.py}
  select_action: {by: deterministic, code: collector/cops/runtime/triage.py}
  memory_write: {by: deterministic, code: collector/cops/runtime/graph.py:validate_memory_update}
  decision_record: {by: deterministic, code: collector/cops/runtime/decision.py:build}
