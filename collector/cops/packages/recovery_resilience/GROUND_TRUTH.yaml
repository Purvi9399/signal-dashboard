# Recovery & Resilience: expected outcomes per scenario, written before the harness and before the package code.
#
# Each expectation follows from the workbook questions (COMPLETE_DELEGATION_DATA rows 195 to 203), the legacy rule
# this package keeps (METRICS.yaml sources.rule: cops/runtime/rules.py recovery_resilience) and the package rules in
# DECISIONS.md (D-RR3 to D-RR14):
#   - RR-1 DISRUPTED: an undisputed row failed (success false or a non-zero exit code), stalled, was stopped by a
#     deny rule or reverted work, or a recovery record shows a restoration was needed; NOT_DISRUPTED needs
#     insights.failed observed and none of these; a failure resting only on disputed rows is INCONCLUSIVE;
#   - RR-2: an undisputed irreversible command is IRREVERSIBLE_CHANGE (a disputed one grounds nothing); no record
#     store or an empty store is INCONCLUSIVE; a checked record is executed, has post-restore checks and does not
#     conflict with another record on the same checkpoint and time; a failed checkpoint hash, or every checked
#     record passing none of its checks, is NOT_RESTORED; every record checked and passing every check is
#     RESTORED_VERIFIED; some restored and some not is PARTIALLY_RESTORED; no checked record is INCONCLUSIVE
#     (approval pending, approval rejected, not started, attempted without checks, conflicting records);
#     NOTHING_TO_RESTORE without a disruption;
#   - RR-3 RECURRING: an undisputed row fails or stalls after the latest restoration time of a checked record;
#     NO_RECOVERY_TO_FOLLOW when RR-2 found no verified restoration;
#   - labels: IRREVERSIBLE, FAILED_RECOVERY, PARTIAL_RECOVERY, RECOVERED (PARTIAL_RECOVERY when RR-3 RECURRING),
#     otherwise INCONCLUSIVE; severity HIGH, HIGH, MEDIUM, NONE, NONE; confidence 0.85, 0.85, 0.8, 0.85, 0.0;
#   - RR-4 and the action: INTERVENTION_REQUIRED (ALERT) for IRREVERSIBLE and FAILED_RECOVERY; MONITORING_REQUIRED
#     (WATCH) for PARTIAL_RECOVERY, an INCONCLUSIVE reading after a disruption or with RR-1 unanswered, and
#     RECOVERED without a confirmed stable window; STABILITY_CONFIRMED (NONE) for RECOVERED with an undisputed
#     successful action after the restoration time, no recurrence and no telemetry measure in a deviation state;
#     NOTHING_TO_CONFIRM (NONE) without a disruption;
#   - the package never executes or requests a rollback, restart, block, pause or restoration; it reads no
#     Incident Response finding; memory precedents change nothing.
# Upstream labels in each world were read from runs of the upstream COPs alone (Behavior Analytics reads STABLE in
# the recovery world; Incident Response is downstream); no expected value was taken from a run of this package.
#
# No model is called: this COP is deterministic (profiles.DETERMINISTIC_COPS). All rows are synthetic.
#
# questions: the answer each question must give (INCONCLUSIVE where it cannot be answered).
# cop_label: accepted labels. confidence: exact value. checks: named properties, defined in harness.CHECKS.

estate: >-
  Seven earlier sessions base1 to base7 of dev1@tenant-a.example with claude-code, 1000 tokens each, tools Read,
  Grep, Read, Edit, Bash with 200 ms steps, collectors local_hooks and otel, plus the scenario session s1 on day 9,
  unless the scenario says otherwise. "deploy fails" is a Bash step make deploy with exit code 1; "restore" is a
  Bash step make restore with exit code 0; "later work" is a Bash step make test with exit code 0 after the
  restore. "the record" is synthetic.recovery_record("ckpt-1", {"files": {"app.py": "v41"}, "db_schema": 12})
  with the stated number of 3 post-restore checks passing, restored at the restore step's time unless the scenario
  says it is the fixture's own time (2026-10-20T10:30:00Z, after the session ended). "the legacy session" is
  evaluation.recovery_session (deploy fails, restore, nothing after).

