  # Investigation A: a disputed irreversible command whose effect on the restored resource cannot be ruled out.
  # The record names a checkpoint (files app.py, db_schema) and three unnamed checks; no record field names the
  # resource the command touched, so its effect is not ruled out. The checkpoint evidence stands (RR-2
  # RESTORED_VERIFIED, label RECOVERED, never IRREVERSIBLE), but the reading is scoped to the checkpoint: category
