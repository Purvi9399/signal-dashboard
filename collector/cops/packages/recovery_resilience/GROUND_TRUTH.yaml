      a session that reads .env (secret_detected, tier 3), with no failure and no record store, run with Runtime
      Monitoring, Interaction Discovery, Anomaly Detection, Policy Enforcement (allow-all), Resource Management,
      this COP and Incident Response; Incident Response reads INCIDENT on the exposure
    questions: {RR-1: NOT_DISRUPTED, RR-2: NOTHING_TO_RESTORE, RR-3: NO_RECOVERY_TO_FOLLOW, RR-4: NOTHING_TO_CONFIRM}
    cop_label: [INCONCLUSIVE]
    confidence: 0.0
    checks: [decision_contract_valid, category_no_disruption, not_failed_recovery, ir_not_read,
             ir_incident_on_its_own_grounds]

  failed_recovery_grounds_incident:
    description: failed_recovery_checks' world, run with Runtime Monitoring before and Incident Response after
    questions: {RR-1: DISRUPTED, RR-2: NOT_RESTORED, RR-3: NO_RECOVERY_TO_FOLLOW, RR-4: INTERVENTION_REQUIRED}
    cop_label: [FAILED_RECOVERY]
    confidence: 0.85
    checks: [decision_contract_valid, verified, ir_reads_failed_recovery, rr_same_without_ir, rr_inputs_unchanged,
             rr_writes_only_recovery_outcome]

  partial_recovery_downstream:
    description: partial_recovery's world, run with Runtime Monitoring before and Incident Response after
    questions: {RR-1: DISRUPTED, RR-2: PARTIALLY_RESTORED, RR-3: NOT_RECURRING, RR-4: MONITORING_REQUIRED}
    cop_label: [PARTIAL_RECOVERY]
    confidence: 0.8
    checks: [decision_contract_valid, ir_reads_partial_as_finding]

  ba_context_only:
    description: recovered_verified_stable's world with Behavior Analytics run first (it reads STABLE)
    questions: {RR-1: DISRUPTED, RR-2: RESTORED_VERIFIED, RR-3: NOT_RECURRING, RR-4: STABILITY_CONFIRMED}
    cop_label: [RECOVERED]
    confidence: 0.85
    checks: [decision_contract_valid, ba_listed_not_ground, same_as_without_ba]

  evidence_change_changes_decision:
    description: >-
      recovered_verified_stable's world, and variants: 1 of 3 checks (PARTIAL_RECOVERY), 0 of 3 checks
      (FAILED_RECOVERY), no record store (INCONCLUSIVE), an undisputed rm -rf (IRREVERSIBLE), a failure after the
      restore (PARTIAL_RECOVERY), no later work (RECOVERED with WATCH)
    questions: {RR-1: DISRUPTED, RR-2: RESTORED_VERIFIED, RR-3: NOT_RECURRING, RR-4: STABILITY_CONFIRMED}
    cop_label: [RECOVERED]
    confidence: 0.85
    checks: [variants_follow_the_evidence]

  topology_and_cycle:
    description: recovered_verified_stable's world
    questions: {RR-1: DISRUPTED, RR-2: RESTORED_VERIFIED, RR-3: NOT_RECURRING, RR-4: STABILITY_CONFIRMED}
    cop_label: [RECOVERED]
    confidence: 0.85
    checks: [consumes_behavior_analytics_only, incident_response_consumes_this, current_edge_back_would_cycle,
             proposed_feedback_edge_cycle_safe, feedback_edge_not_added, topology_document_matches, order_respected]

  downstream_contracts:
    description: recovered_verified_stable's world, run with Runtime Monitoring before and Incident Response after
    questions: {RR-1: DISRUPTED, RR-2: RESTORED_VERIFIED, RR-3: NOT_RECURRING, RR-4: STABILITY_CONFIRMED}
    cop_label: [RECOVERED]
    confidence: 0.85
    checks: [ir_reads_recovered_as_quiet, gi_consumes_this, recipients_downstream]
