  # ---------------------------------------------------------------- Revision 1 (R-RR1, purvi 2026-11-27)
  # Written before the code. P-RR1 approved: a previous-cycle, verified-only feedback edge Incident Response -> this
  # COP. The earlier finding is context only (requirements 1 to 7 of purvi's approval):
  #   - delivered by the shared feedback step only when verified and from a cycle other than the current one
  #     (graph.prior_feedback); read by this COP only when it carries a run_id, a decided_at and an association
  #     (the same session_id as the case session, or a recovery record whose disruption_refs names its finding_id);
  #   - used only when its decided_at falls on or after the session's first undisputed disruption (else STALE: it
  #     cannot name this disruption) and before the restoration time it contextualizes (else ORDER: it does not
  #     precede the recovery observation); with no restoration time it is listed and contextualizes nothing;
  #   - never a ground: every answer, label, severity, confidence and action equals the run without the feedback;
  #     the earlier finding is never modified; an earlier incident resting on this COP's own earlier finding is
  #     flagged and never read as confirmation.
  # "the feedback world" is a session s1 that reads .env (the exposure), then deploy fails, restore, later work, run
  # with Runtime Monitoring, Interaction Discovery, Anomaly Detection, Policy Enforcement (allow-all), Resource
  # Management, this COP and Incident Response. Cycle 1 has no record store: this COP reads INCONCLUSIVE and Incident
  # Response INCIDENT on the exposure, decided at the evaluation clock 2026-10-29T00:00:00Z. Cycle 2 runs the same
  # session with the record passing 3 of 3 checks restored at 2026-10-30T10:00:00Z (after the incident and after the
  # session's rows), and receives cycle 1's Incident Response finding with that cycle's run_id, decided_at and
  # session_id. Nothing follows the restoration time, so stability is not confirmed.

  p1_verified_earlier_incident:
    description: the feedback world, cycle 2
    questions: {RR-1: DISRUPTED, RR-2: RESTORED_VERIFIED, RR-3: NOT_RECURRING, RR-4: MONITORING_REQUIRED}
    cop_label: [RECOVERED]
    confidence: 0.85
    checks: [decision_contract_valid, action_watch, earlier_incident_accepted, earlier_incident_provenance,
             earlier_incident_not_a_ground, same_without_feedback, earlier_ir_finding_unmodified,
             current_cycle_ir_reads_this_cop, feedback_row_previous_cycle, no_incident_context_limitation]

  p1_unverified_withheld:
