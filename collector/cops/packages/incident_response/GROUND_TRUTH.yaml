    questions: {IR-1: INCIDENT_INDICATED, IR-2: SEVERITY_HIGH, IR-3: ONGOING, IR-4: INTERVENTION_JUSTIFIED,
                IR-5: REQUEST_APPROVAL}
    cop_label: [INCONCLUSIVE]
    checks: [model_conclusion_rejected, never_no_incident, category_incident_unconfirmed, nothing_executed]

  adversarial_model_overreaches:
    description: >-
      the verified-violation world; Incident Response's model scripted (simulated) to conclude INCIDENT and propose
      BLOCK
    questions: {IR-1: INCIDENT_INDICATED, IR-2: SEVERITY_HIGH, IR-3: ONGOING, IR-4: INTERVENTION_JUSTIFIED,
                IR-5: REQUEST_APPROVAL}
    cop_label: [INCIDENT]
    checks: [model_action_replaced, action_request_approval, block_never_proposed, nothing_executed]

  memory_precedent:
    description: >-
      an earlier session m0 with the secret, run with upstream, writes an incident_outcome record that a reviewer
      validates; the current session has the secret too
    questions: {IR-1: INCIDENT_INDICATED, IR-2: SEVERITY_MEDIUM, IR-3: INCONCLUSIVE, IR-4: ATTENTION_JUSTIFIED,
                IR-5: ALERT}
    cop_label: [INCIDENT]
    checks: [precedent_listed, recurrence_noted, same_as_without_memory, record_written]

  previous_cycle_feedback_not_circular:
    description: >-
      the secret, permissive policy with the risk register; cycle 1 runs Risk Mitigation after Incident Response;
      cycle 2 runs the upstream and Incident Response with cycle 1's Risk Mitigation finding as feedback
    questions: {IR-1: INCIDENT_INDICATED, IR-2: SEVERITY_MEDIUM, IR-3: INCONCLUSIVE, IR-4: ATTENTION_JUSTIFIED,
                IR-5: ALERT}
    cop_label: [INCIDENT]
    checks: [feedback_recorded_not_counted, same_as_without_feedback, risk_mitigation_not_current_input]

  evidence_change_changes_decision:
    description: >-
      the exposure world against five changes: no secret; outbound after the secret; the prod write denied; a deny
      rule instead of the secret; only the CLI wrapper
    questions: {IR-1: INCIDENT_INDICATED, IR-2: SEVERITY_MEDIUM, IR-3: INCONCLUSIVE, IR-4: ATTENTION_JUSTIFIED,
                IR-5: ALERT}
    cop_label: [INCIDENT]
    checks: [no_secret_no_incident, outbound_makes_ongoing, violation_makes_intervention, deny_rule_makes_watch,
             telemetry_makes_inconclusive]

  ct_context_only:
