    reason: >-
      A-IR1 (U-IR1, purvi 2026-11-27): a deterministic incident that passes verification is kept when the model is
      unavailable; the plan is recorded UNAVAILABLE. The first build made the finding INCONCLUSIVE
    replaces: [cop_label, category_incident_unconfirmed, answers_kept_when_unconfirmed]
    cop_label: [INCIDENT]
    checks: [category_incident_intervention, plan_unavailable, deterministic_finding_published]
  adversarial_model_contradicts:
    reason: >-
      A-IR1 (U-IR1): a model that claims NO_INCIDENT never overrides a verified deterministic incident; the plan is
      REJECTED and the model output kept. The first build made the finding INCONCLUSIVE
    replaces: [cop_label, category_incident_unconfirmed]
    cop_label: [INCIDENT]
    checks: [category_incident_intervention, plan_rejected, deterministic_finding_published]
  adversarial_model_overreaches:
    reason: >-
