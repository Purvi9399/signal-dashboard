# Incident Response: expected outcomes per scenario, written before the harness and before the package code.
#
# Each expectation follows from the workbook questions (COMPLETE_DELEGATION_DATA rows 94 to 102), the legacy rule
# this package keeps (METRICS.yaml sources.rule: cops/interpret.py and cops/runtime/rules.py incident_response),
# and the package rules in DECISIONS.md (D-IR2 to D-IR13):
#   - incident grounds: a verified Policy Enforcement VIOLATION; a verified Recovery & Resilience FAILED_RECOVERY
#     or IRREVERSIBLE; an exposure (insights.secrets or insights.sensitive_unasked in EXCEPTION or CRITICAL) on rows
#     the collectors do not dispute;
#   - finding-without-incident grounds: a verified Anomaly Detection ANOMALOUS; insights.blocked in a deviation
#     state; a verified Policy Enforcement APPROVAL_REQUIRED; a verified Recovery & Resilience PARTIAL_RECOVERY;
#   - every other consumed finding (Interaction Discovery, Workflow Orchestration, Resource Management,
#     Classification & Tagging) is context; quiet readings ground nothing; Runtime Monitoring is evidence quality;
#   - severity: HIGH for a violation, a failed or irreversible recovery, or an exposure with an independent
#     verified anomaly; MEDIUM for an exposure or an anomaly Anomaly Detection alerts on; LOW for other findings;
#   - state: ONGOING for a pending denied operation, a failed recovery or outbound calls after a secret; CONTAINED
#     for a stopped operation with no exposure; never RESOLVED; otherwise still uncertain (INCONCLUSIVE);
#   - response: REQUEST_APPROVAL for a violation whose operation Policy Enforcement proposes to block; ESCALATE for
#     a failed recovery or an exposure with an independent anomaly; ALERT for other incidents and for an anomaly
#     Anomaly Detection alerts on; WATCH for other findings; NONE;
#   - no ground and insufficient evidence (a required metric unobserved, no consumed finding verified, Runtime
#     Monitoring INSUFFICIENT, an incident-grade label unverified, the only exposure disputed): INCONCLUSIVE;
#   - an incident whose intervention IR-4 justifies goes to the model for the containment plan; the package keeps
#     the label and action, and a model that disagrees, or no model, leaves the finding INCONCLUSIVE;
#   - confidence: the lowest confidence of the verified Runtime Monitoring, Anomaly Detection, Policy Enforcement
#     and Interaction Discovery findings used, else 0.8 x the evidence level (0.9 when Runtime Monitoring is absent);
#   - memory precedents and Risk Mitigation's previous-cycle finding never change an answer.
# Upstream labels in each world were read from runs of the upstream COPs alone; no expected value was taken from a
# run of this package.
#
# Where Incident Response, Anomaly Detection or Classification & Tagging run with a model, the reply is scripted
# (fixtures.Script, every invocation simulated); no paid model is called. All rows are synthetic.
#
# questions: the answer each question must give (INCONCLUSIVE where it cannot be answered).
# cop_label: accepted labels. confidence: exact value. checks: named properties, defined in harness.CHECKS.

estate: >-
  Seven earlier sessions base1 to base7 of dev1@tenant-a.example with claude-code, 1000 tokens each, tools Read,
  Grep, Read, Edit, Bash with 200 ms steps, collectors local_hooks and otel, plus the scenario session s1 on day 9,
  unless the scenario says otherwise. "secret" is a Read of /ws/.env with secret_detected true and sensitivity_tier
  3; "prod write" is the proposed write to /prod/secrets/db.env that policy P-write-prod denies
  (evaluation.sensitive_policy), which Policy Enforcement reads VIOLATION and proposes to BLOCK; "permissive" is
  the allow-all policy. "upstream" runs runtime_monitoring, interaction_discovery, anomaly_detection,
  policy_enforcement and resource_management before incident_response, with a quota of 10,000,000 tokens.

