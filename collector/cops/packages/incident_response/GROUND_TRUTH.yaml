  # ---------------------------------------------------------------- revision R-IR1 (2026-11-27)
  # Written before the correction code, from purvi's conditional acceptance (A-IR1, U-IR1): an incident that the
  # package's deterministic evidence establishes, and that passes the existing verification independently, keeps
  # its label, severity, evidence and deterministic response whatever the model does. The containment plan is
  # recorded apart (cop_specific.containment_plan.status: VERIFIED, UNVERIFIED, REJECTED or UNAVAILABLE). Only a
  # failure of the deterministic incident evidence itself makes the finding INCONCLUSIVE. Confidence is IR-4's
  # rule value: the lowest of the verified RM (0.9), ID (0.8), AD (0.8) and PE (0.85) confidences = 0.8.

