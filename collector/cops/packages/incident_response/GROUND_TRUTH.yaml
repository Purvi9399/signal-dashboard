      the exposure world with the taxonomy; Classification & Tagging runs with a scripted model (simulated) before
      Incident Response
    questions: {IR-1: INCIDENT_INDICATED, IR-2: SEVERITY_MEDIUM, IR-3: INCONCLUSIVE, IR-4: ATTENTION_JUSTIFIED,
                IR-5: ALERT}
    cop_label: [INCIDENT]
    checks: [ct_listed_as_context, same_as_without_ct]

  downstream_contracts:
