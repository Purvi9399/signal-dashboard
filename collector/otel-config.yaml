receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed
  file:
    path: /data/events.json
    # Without rotation the exporter truncates on every start, so restarting
    # the collector destroys everything captured since the last restart.
    rotation:
      max_megabytes: 100
      max_backups: 50
      localtime: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      exporters: [debug, file]
    traces:
      receivers: [otlp]
      exporters: [debug, file]
