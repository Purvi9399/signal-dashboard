<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COPS metric network</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f0f2f5;--ink:#16191d;--muted:#66707c;--line:#d8dde4;
  --edge:#8b939d;--focus:#16191d;--shadow:0 1px 3px rgba(0,0,0,.08);
  --built:#2368a2;--built-bg:#e8f2fb;--hyp:#76808a;--hyp-bg:#f1f3f5;
  --active:#147a55;--active-bg:#e8f6ef;--next:#a56708;--next-bg:#fff4df;--defined:#6f5aa7;--defined-bg:#f0ecfb;
  --normal:#2f855a;--warning:#b7791f;--exception:#c05621;--critical:#c53030;--unknown:#718096;--na:#a0aec0;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111418;--panel:#181c21;--panel2:#20252b;--ink:#edf0f3;--muted:#aab2bc;--line:#353c45;
    --edge:#66707b;--focus:#f4f6f8;--shadow:none;
    --built:#6aaee6;--built-bg:#182b3a;--hyp:#9aa4ae;--hyp-bg:#22282e;
    --active:#5fc49b;--active-bg:#173329;--next:#e6b45f;--next-bg:#382b16;--defined:#a996df;--defined-bg:#2b2440;
    --normal:#68d391;--warning:#ecc94b;--exception:#ed8936;--critical:#fc8181;--unknown:#a0aec0;--na:#718096;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px 12px;position:sticky;top:0;z-index:20}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
h1{font-size:20px;margin:0 0 4px}
.subtitle{color:var(--muted);font-size:12px;max-width:900px}
.view-tabs{display:flex;gap:6px;flex:0 0 auto}
.view-tab{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px}
.view-tab[aria-selected="true"]{outline:2px solid var(--focus);outline-offset:-2px;background:var(--panel)}
.pipeline{display:flex;align-items:center;gap:5px;overflow:auto;padding:11px 0 3px}
.pipe-step{white-space:nowrap;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 9px;font-size:11px}
.pipe-arrow{color:var(--muted)}
.legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-top:9px;font-size:11px;color:var(--muted)}
.legend-item{display:flex;gap:6px;align-items:center}
.legend-mark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid currentColor;font-size:9px;font-weight:700}
.legend-mark.built{color:var(--built);background:var(--built-bg);border-radius:50%}
.legend-mark.hyp{color:var(--hyp);background:repeating-linear-gradient(135deg,var(--hyp-bg),var(--hyp-bg) 3px,transparent 3px,transparent 6px)}
.legend-mark.active{color:var(--active);background:var(--active-bg);border-radius:50%}
.legend-mark.next{color:var(--next);background:var(--next-bg);transform:rotate(45deg)}
.legend-mark.next span{transform:rotate(-45deg)}
.legend-mark.defined{color:var(--defined);background:var(--defined-bg)}
.warning{display:none;margin-top:8px;border:1px solid #c27a1b;background:#fff7e6;color:#6b4300;border-radius:8px;padding:7px 10px;font-size:11px}
@media(prefers-color-scheme:dark){.warning{background:#332610;color:#ffd99b;border-color:#8b6427}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:end;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px}
.control{display:grid;gap:3px}
.control label,.control .label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.control input[type="search"],.control select{height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 9px}
.toggle-group{display:flex;gap:5px;height:32px;align-items:center}
.check{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--panel2);font-size:12px}
.main{flex:1;display:grid;grid-template-columns:minmax(660px,1fr) 390px;gap:12px;padding:12px 20px 20px;min-height:0}
.visual{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
.bipartite{height:calc(100vh - 250px);min-height:520px;position:relative;display:grid;grid-template-columns:1fr 1fr}
.col{min-width:0;display:flex;flex-direction:column}
.col:first-child{border-right:1px solid var(--line)}
.col-head{height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:12px}
.scroller{overflow:auto;min-height:0;flex:1;padding:10px 12px;scrollbar-gutter:stable}
.family{margin:0 0 14px}
.family-title{position:sticky;top:-10px;z-index:3;margin:0 -2px 6px;padding:6px 2px 5px;background:var(--panel);border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.node-list{display:grid;gap:6px}
.node-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;position:relative;transition:opacity .12s,border-color .12s,box-shadow .12s}
.node-card:hover{box-shadow:0 0 0 1px var(--focus) inset}
.node-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.node-card.selected,.node-card.connected{box-shadow:0 0 0 2px var(--focus) inset}
.node-card.dim{opacity:.20}
.node-title{font-size:12px;font-weight:700;overflow-wrap:anywhere}
.node-id{font:10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}
.count{font-size:11px;font-weight:800;min-width:24px;text-align:right}
.status-line{grid-column:1/-1;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;gap:4px;align-items:center;border:1px solid currentColor;border-radius:999px;padding:1px 6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.metric-built{border-left:4px solid var(--built)}
.metric-built .badge{color:var(--built);background:var(--built-bg)}
.metric-hyp{border-left:4px dashed var(--hyp);background:repeating-linear-gradient(135deg,var(--hyp-bg),var(--hyp-bg) 5px,transparent 5px,transparent 11px)}
.metric-hyp .badge{color:var(--hyp);background:var(--hyp-bg)}
.cop-active{border-left:4px solid var(--active)}
.cop-next{border-left:4px solid var(--next)}
.cop-defined{border-left:4px solid var(--defined)}
.badge.active{color:var(--active);background:var(--active-bg)}
.badge.next{color:var(--next);background:var(--next-bg)}
.badge.defined{color:var(--defined);background:var(--defined-bg)}
.edge-layer{position:absolute;inset:42px 0 0;width:100%;height:calc(100% - 42px);pointer-events:none;z-index:5;overflow:visible}
.edge{fill:none;stroke:var(--edge);stroke-width:.8;opacity:.22}
.edge.hot{stroke-width:2.5;opacity:.92}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:calc(100vh - 250px);min-height:520px;overflow:auto;box-shadow:var(--shadow)}
.detail-inner{padding:14px}
.detail-empty{color:var(--muted);padding:28px 12px;text-align:center}
.detail h2{font-size:18px;margin:0 0 5px}
.detail h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:17px 0 7px}
.detail p{margin:6px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 7px;font-size:10px}
.group-block{border-top:1px solid var(--line);padding:9px 0}
.group-block:first-child{border-top:0}
.metric-row,.reader-row{border:1px solid var(--line);border-radius:7px;padding:7px;margin:5px 0;background:var(--panel2)}
.metric-row.hyp{background:repeating-linear-gradient(135deg,var(--hyp-bg),var(--hyp-bg) 5px,transparent 5px,transparent 11px)}
.row-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700}
.row-sub{font-size:10px;color:var(--muted);margin-top:2px}
.context-change{margin-top:5px;border-left:2px solid var(--line);padding-left:7px;font-size:10px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px;font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
.example-note{font-size:11px;color:var(--muted);margin:5px 0 7px}
.network-view{display:none;height:calc(100vh - 250px);min-height:520px;overflow:auto;position:relative}
.network-stage{position:relative;min-width:900px;height:920px}
.network-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.net-edge{fill:none;stroke:var(--edge);stroke-width:1.1;opacity:.35}
.net-edge.hot{stroke-width:2.8;opacity:.95}
.net-card{position:absolute;width:170px;min-height:58px;z-index:2;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:7px 8px}
.net-card.dim{opacity:.18}
.net-card.selected,.net-card.connected{box-shadow:0 0 0 2px var(--focus) inset}
.net-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.net-name{font-size:11px;font-weight:800}
.net-count{font-size:9px;color:var(--muted);margin-top:2px}
.live-box{border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel2)}
.live-seg{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--line);margin:7px 0}
.live-seg span{height:100%;min-width:0}
.state-normal{background:var(--normal)}.state-warning{background:var(--warning)}.state-exception{background:var(--exception)}
.state-critical{background:var(--critical)}.state-unknown{background:var(--unknown)}.state-not_applicable{background:var(--na)}
.live-legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:10px}
.live-state{display:flex;justify-content:space-between;gap:8px}
.small-table{width:100%;border-collapse:collapse;font-size:10px}
.small-table td{padding:3px 0;border-bottom:1px solid var(--line)}
.small-table td:last-child{text-align:right;font-weight:700}
.hidden{display:none!important}
@media(max-width:1100px){
  .main{grid-template-columns:1fr}
  .detail{height:auto;max-height:none}
  .bipartite,.network-view{height:650px}
}
@media(max-width:760px){
  .topbar{padding:12px}
  .controls{padding:8px 12px}
  .main{padding:8px 12px 14px;min-width:700px}
  body{overflow-x:auto}
  .bipartite{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="title-row">
    <div>
      <h1 id="appTitle">COPS metric network</h1>
      <div class="subtitle" id="appNote"></div>
    </div>
    <div class="view-tabs" role="tablist" aria-label="Views">
      <button class="view-tab" id="tabBip" role="tab" aria-selected="true" aria-controls="bipView">Metrics ↔ COPS</button>
      <button class="view-tab" id="tabFlow" role="tab" aria-selected="false" aria-controls="flowView">COPS hand-offs</button>
    </div>
  </div>
  <div class="pipeline" id="pipeline" aria-label="Pipeline"></div>
  <div class="legend-row" id="legend"></div>
  <div class="warning" id="countWarning" role="status"></div>
</header>

<section class="controls" aria-label="Filters">
  <div class="control">
    <label for="search">Search</label>
    <input id="search" type="search" placeholder="Metric, family, COP, question…">
  </div>
  <div class="control">
    <span class="label">Metric status</span>
    <div class="toggle-group">
      <label class="check"><input id="showBuilt" type="checkbox" checked> Built</label>
      <label class="check"><input id="showHyp" type="checkbox" checked> Hypothetical</label>
    </div>
  </div>
  <div class="control">
    <label for="feasibility">Feasibility</label>
    <select id="feasibility"><option value="">All</option></select>
  </div>
  <div class="control">
    <label for="family">Metric family</label>
    <select id="family"><option value="">All</option></select>
  </div>
  <div class="control">
    <label for="copStatus">COP status</label>
    <select id="copStatus"><option value="">All</option><option value="active">Active</option><option value="next">Next</option><option value="defined">Defined</option></select>
  </div>
  <div class="control">
    <label for="sortMetrics">Sort metrics</label>
    <select id="sortMetrics"><option value="family">Family</option><option value="name">Name</option><option value="count">Number of COPS</option></select>
  </div>
  <button class="view-tab" id="clearSel" type="button">Clear selection</button>
</section>

<main class="main">
  <section class="visual" aria-label="Network visualization">
    <div class="bipartite" id="bipView">
      <div class="col">
        <div class="col-head"><span>Metrics</span><span id="metricVisibleCount"></span></div>
        <div class="scroller" id="metricScroll"><div id="metricList"></div></div>
      </div>
      <div class="col">
        <div class="col-head"><span>COPS</span><span id="copVisibleCount"></span></div>
        <div class="scroller" id="copScroll"><div id="copList" class="node-list"></div></div>
      </div>
      <svg class="edge-layer" id="edgeLayer" aria-hidden="true"></svg>
    </div>
    <div class="network-view" id="flowView" role="tabpanel" aria-labelledby="tabFlow">
      <div class="network-stage" id="networkStage">
        <svg class="network-svg" id="networkSvg" aria-hidden="true"></svg>
        <div id="networkNodes"></div>
      </div>
    </div>
  </section>

  <aside class="detail" id="detail" aria-live="polite">
    <div class="detail-inner" id="detailInner"></div>
  </aside>
</main>
</div>

<script>
const CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: ""
};

const DATA = {"meta":{"title":"Project Signal: metrics to COPS network (target state)","note":"Target state. Metrics marked built exist today in signal_metrics.py; metrics marked hypothetical are assumed built so the whole network can be seen. Every metric is computed once, deterministically. COPS only read metrics and interpret them.","status_legend":{"built":"computed today","hypothetical":"assumed built for this view"},"feasibility_legend":{"derivable_now":"can be computed now from fields already collected","new_script":"needs a new deterministic script over existing data","new_telemetry":"needs telemetry that is not collected today"},"cop_status_legend":{"active":"switched on and tested","next":"switched on after the first three","defined":"specified, not running"},"metric_states":["NORMAL","WARNING","EXCEPTION","CRITICAL","UNKNOWN","NOT_APPLICABLE"],"metric_state_meaning":{"UNKNOWN":"could have happened but could not be seen","NOT_APPLICABLE":"the situation never arose"}},"pipeline":["Collectors","observables (Supabase)","signal_traces.py (paths, lanes, effects)","signal_metrics.py (every metric, once)","metric_events","COPS (interpret)","cop_decisions"],"response_schema":{"interpretation":"one label from the COP's own list","severity":"NONE | LOW | MEDIUM | HIGH | CRITICAL","action":"NONE | WATCH | ALERT | INSTRUCT | REQUEST_CONTEXT | REQUEST_APPROVAL | PASS_TO_COP | ESCALATE | PAUSE | BLOCK","action_reason":"why this action","driving_metrics":"the metrics that most drove the reading","downstream":"COPS the finding is passed to","also_recorded":["evidence_refs","metrics_read","context_used","evidence_score","evaluation_ms","failed","error"],"limits":"PAUSE and BLOCK are recommended only; every run is dry-run today"},"cops":[{"id":"workflow_orchestration","name":"Workflow Orchestration","question":"Is the task progressing coherently toward its intended state?","status":"defined","cadence":"session","interpretations":["NORMAL","DRIFTING","STALLED","EXCESSIVE_DELEGATION","UNEXPECTED_BRANCH"],"permitted_actions":["NONE","WATCH","ALERT","INSTRUCT","PASS_TO_COP"],"downstream":["behavior_analytics","incident_response"],"reads_decisions_from":[],"example_response":{"interpretation":"STALLED","severity":"LOW","action":"ALERT","action_reason":"no progress for several turns with plan items open","driving_metrics":["insights.repetition","insights.stalled","insights.duration_outlier"],"downstream":["behavior_analytics","incident_response"],"note":"illustrative"}},{"id":"runtime_monitoring","name":"Runtime Monitoring","question":"Is the evidence required for this governance decision present, reliable and sufficiently complete?","status":"active","cadence":"session","interpretations":["SUFFICIENT","DEGRADED","INSUFFICIENT"],"permitted_actions":["NONE","WATCH","ALERT","REQUEST_CONTEXT","PASS_TO_COP"],"downstream":["audit_traceability","incident_response"],"reads_decisions_from":[],"example_response":{"interpretation":"DEGRADED","severity":"LOW","action":"WATCH","action_reason":"findings stand but rest on partial evidence","driving_metrics":["insights.stalled","insights.unattributed","telemetry.collector_coverage"],"downstream":["audit_traceability","incident_response"],"note":"shape produced today"}},{"id":"anomaly_detection","name":"Anomaly Detection","question":"Is the observed behaviour materially different from what is expected in this context?","status":"active","cadence":"session","interpretations":["NORMAL","ANOMALOUS","INDETERMINATE"],"permitted_actions":["NONE","WATCH","ALERT","REQUEST_CONTEXT","PASS_TO_COP"],"downstream":["classification_tagging","policy_enforcement","risk_mitigation","incident_response"],"reads_decisions_from":["runtime_monitoring"],"example_response":{"interpretation":"ANOMALOUS","severity":"HIGH","action":"ALERT","action_reason":"deviation 8.0 on insights.token_outlier; unusual is not prohibited","driving_metrics":["insights.repetition","insights.retry","insights.duration_outlier"],"downstream":["classification_tagging","policy_enforcement"],"note":"shape produced today"}},{"id":"context_memory","name":"Context & Memory","question":"Is the current context internally consistent, relevant to the task, and supported by useful precedent?","status":"defined","cadence":"session","interpretations":["CONTEXT_OK","STALE","CONTRADICTORY","CONTEXT_LOSS","PRECEDENT_FOUND"],"permitted_actions":["NONE","WATCH"],"downstream":["behavior_analytics"],"reads_decisions_from":[],"example_response":{"interpretation":"CONTEXT_LOSS","severity":"LOW","action":"WATCH","action_reason":"files re-read after every compaction","driving_metrics":["task.drift_score","context.compaction_count","context.loss_after_compaction"],"downstream":["behavior_analytics"],"note":"illustrative"}},{"id":"interaction_discovery","name":"Interaction Discovery","question":"Who or what is interacting with whom, through what route, and how is the activity propagating?","status":"next","cadence":"session","interpretations":["CONTAINED","PROPAGATING","NEW_ROUTE","PATH_PARTIAL"],"permitted_actions":["NONE","WATCH","PASS_TO_COP"],"downstream":["policy_enforcement","risk_mitigation","audit_traceability"],"reads_decisions_from":["runtime_monitoring"],"example_response":{"interpretation":"NEW_ROUTE","severity":"MEDIUM","action":"PASS_TO_COP","action_reason":"new edge to an MCP server never used by this operator","driving_metrics":["insights.outside","insights.unattributed","telemetry.lane_linkage"],"downstream":["policy_enforcement","risk_mitigation"],"note":"illustrative"}},{"id":"incident_response","name":"Incident Response","question":"Do the current findings constitute an actionable incident, and what should happen now?","status":"active","cadence":"session","interpretations":["NO_INCIDENT","WATCH","INCIDENT"],"permitted_actions":["NONE","WATCH","ALERT","INSTRUCT","REQUEST_APPROVAL","PAUSE","BLOCK","ESCALATE"],"downstream":[],"reads_decisions_from":["runtime_monitoring","anomaly_detection","policy_enforcement","interaction     <span class="legend-item"><span class="legend-mark active">●</span>Active — ${esc(cl.active||"")}</span>
    <span class="legend-item"><span class="legend-mark next"><span>◆</span></span>Next — ${esc(cl.next||"")}</span>
    <span class="legend-item"><span class="legend-mark defined">■</span>Defined — ${esc(cl.defined||"")}</span>
  `;

  const families=[...new Set(DATA.metrics.map(m=>m.family))].sort();
  $("#family").insertAdjacentHTML("beforeend",families.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join(""));
  const feas=[...new Set(DATA.metrics.filter(m=>m.status==="hypothetical" && m.feasibility).map(m=>m.feasibility))].sort();
  $("#feasibility").insertAdjacentHTML("beforeend",feas.map(f=>`<option value="${esc(f)}">${esc(titleCase(f))}</option>`).join(""));
}

function validateCounts(){
  const exp=DATA.expected_counts||{}, problems=[];
  const actualBuilt=DATA.metrics.filter(m=>m.status==="built").length;
  const actualHyp=DATA.metrics.filter(m=>m.status==="hypothetical").length;
  const checks=[
    ["metrics_total",DATA.metrics.length],
    ["built",actualBuilt],["hypothetical",actualHyp],
    ["cops_total",DATA.cops.length],["edges_total",DATA.edges.length]
  ];
  checks.forEach(([k,a])=>{ if(exp[k]!==undefined && Number(exp[k])!==a) problems.push(`${k}: expected ${exp[k]}, found ${a}`); });
  if(exp.metrics_per_cop){
    DATA.cops.forEach(c=>{
      const a=(edgesByCop.get(c.id)||[]).length, x=exp.metrics_per_cop[c.id];
      if(x!==undefined && Number(x)!==a) problems.push(`${c.id} metrics: expected ${x}, found ${a}`);
    });
  }
  if(exp.built_metrics_per_cop){
    DATA.cops.forEach(c=>{
      const a=(edgesByCop.get(c.id)||[]).filter(e=>metricById.get(e.metric)?.status==="built").length;
      const x=exp.built_metrics_per_cop[c.id];
      if(x!==undefined && Number(x)!==a) problems.push(`${c.id} built metrics: expected ${x}, found ${a}`);
    });
  }
  if(exp.cops_per_metric){
    DATA.metrics.forEach(m=>{
      const a=(edgesByMetric.get(m.id)||[]).length, x=exp.cops_per_metric[m.id];
      if(x!==undefined && Number(x)!==a) problems.push(`${m.id} readers: expected ${x}, found ${a}`);
    });
  }
  if(problems.length){
    const el=$("#countWarning");
    el.style.display="block";
    el.innerHTML=`<strong>Count check warning:</strong> ${problems.length} mismatch${problems.length===1?"":"es"}. ${esc(problems.slice(0,5).join(" · "))}${problems.length>5?" · …":""}`;
  }
}

function metricMatches(m){
  if(m.status==="built" && !state.showBuilt) return false;
  if(m.status==="hypothetical" && !state.showHyp) return false;
  if(state.feasibility && m.feasibility!==state.feasibility) return false;
  if(state.family && m.family!==state.family) return false;
  const q=state.search.trim().toLowerCase();
  if(q){
    const hay=[m.id,m.name,m.family,m.status,m.feasibility,m.needs].filter(Boolean).join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function copMatches(c){
  if(state.copStatus && c.status!==state.copStatus) return false;
  const q=state.search.trim().toLowerCase();
  if(q){
    const hay=[c.id,c.name,c.question,c.status,c.cadence,(c.interpretations||[]).join(" "),(c.permitted_actions||[]).join(" ")].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderMetricList(){
  const visible=DATA.metrics.filter(metricMatches);
  $("#metricVisibleCount").textContent=`${visible.length} / ${DATA.metrics.length}`;
  const groups=new Map();
  visible.forEach(m=>{if(!groups.has(m.family))groups.set(m.family,[]);groups.get(m.family).push(m)});
  let fams=[...groups.keys()].sort();
  if(state.sort==="name"){
    fams.sort((a,b)=>{
      const aa=[...groups.get(a)].sort((x,y)=>x.name.localeCompare(y.name))[0]?.name||"";
      const bb=[...groups.get(b)].sort((x,y)=>x.name.localeCompare(y.name))[0]?.name||"";
      return aa.localeCompare(bb);
    });
  }else if(state.sort==="count"){
    fams.sort((a,b)=>{
      const am=Math.max(...groups.get(a).map(m=>(edgesByMetric.get(m.id)||[]).length));
      const bm=Math.max(...groups.get(b).map(m=>(edgesByMetric.get(m.id)||[]).length));
      return bm-am || a.localeCompare(b);
    });
  }
  const html=fams.map(f=>{
    let arr=groups.get(f);
    if(state.sort==="count") arr=[...arr].sort((a,b)=>(edgesByMetric.get(b.id)||[]).length-(edgesByMetric.get(a.id)||[]).length || a.name.localeCompare(b.name));
    else arr=[...arr].sort((a,b)=>a.name.localeCompare(b.name));
    return `<section class="family"><h3 class="family-title">${esc(f)} · ${arr.length}</h3><div class="node-list">${
      arr.map(metricCard).join("")
    }</div></section>`;
  }).join("");
  $("#metricList").innerHTML=html || `<div class="detail-empty">No metrics match the current filters.</div>`;
}

function drawBipartiteEdges(){
  if(state.view!=="bip") return;
  const svg=$("#edgeLayer"), host=$("#bipView");
  const hr=host.getBoundingClientRect(), yOffset=42;
  const visibleMetricIds=new Set([...$("#metricList").querySelectorAll('[data-type="metric"]')].map(x=>x.dataset.id));
  const visibleCopIds=new Set([...$("#copList").querySelectorAll('[data-type="cop"]')].map(x=>x.dataset.id));
  const relevant = state.selected?.type==="metric"
    ? (edgesByMetric.get(state.selected.id)||[])
    : state.selected?.type==="cop"
      ? (edgesByCop.get(state.selected.id)||[])
      : DATA.edges;
  let d=[];
  relevant.forEach(e=>{
    if(!visibleMetricIds.has(e.metric)||!visibleCopIds.has(e.cop)) return;
    const a=$("#metricList").querySelector(`[data-id="${CSS.escape(e.metric)}"]`);
    const b=$("#copList").querySelector(`[data-id="${CSS.escape(e.cop)}"]`);
    if(!a||!b)return;
    const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
    const insideA=ar.bottom>hr.top+yOffset && ar.top<hr.bottom;
    const insideB=br.bottom>hr.top+yOffset && br.top<hr.bottom;
    if(!insideA||!insideB)return;
    const x1=ar.right-hr.left, y1=ar.top+ar.height/2-hr.top-yOffset;
    const x2=br.left-hr.left, y2=br.top+br.height/2-hr.top-yOffset;
    const dx=Math.max(40,(x2-x1)*.45);
    const hot=!!state.selected && ((state.selected.type==="metric"&&state.selected.id===e.metric)||(state.selected.type==="cop"&&state.selected.id===e.cop));
    d.push(`<path class="edge${hot?" hot":""}" d="M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1+dx).toFixed(1)} ${y1.toFixed(1)}, ${(x2-dx).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`);
  });
  svg.setAttribute("viewBox",`0 0 ${Math.max(1,hr.width)} ${Math.max(1,hr.height-yOffset)}`);
  svg.innerHTML=d.join("");
}

function scheduleEdges(){

function readerRow(e){
  const c=copById.get(e.cop);
  const changes=e.context_changes||[];
  return `<div class="reader-row">
    <div class="row-head"><span>${esc(c?.name||e.cop)}</span><span>${esc(c?.status||"")}</span></div>
    <div class="row-sub">${esc(e.means||"")}</div>
    ${changes.map(ch=>`<div class="context-change"><strong>When:</strong> ${esc(ch.when)}<br><strong>Meaning:</strong> ${esc(ch.meaning)}</div>`).join("")}
  </div>`;
}

function renderNetwork(){
  const stage=$("#networkStage"), holder=$("#networkNodes");
  const cops=DATA.cops.filter(copMatches);
  const W=Math.max(900,stage.clientWidth||900), H=920, cx=W/2, cy=H/2, rx=Math.min(360,W*.37), ry=365;
  const positions=new Map();
  cops.forEach((c,i)=>{
    const angle=-Math.PI/2 + (Math.PI*2*i/Math.max(1,cops.length));
    positions.set(c.id,{x:cx+rx*Math.cos(angle)-85,y:cy+ry*Math.sin(angle)-29});
  });
  holder.innerHTML=cops.map(c=>{
    const p=positions.get(c.id), n=(edgesByCop.get(c.id)||[]).length;
    let cls=`net-card cop-${c.status}`;
    if(state.selected?.type==="cop"){
      if(state.selected.id===c.id) cls+=" selected";
      else{
        const connected=(copLinksFrom.get(state.selected.id)||[]).some(l=>l.to===c.id)||(copLinksTo.get(state.selected.id)||[]).some(l=>l.from===c.id);
        cls+=connected?" connected":" dim";
      }
    }else if(state.selected?.type==="metric"){
      const related=(edgesByMetric.get(state.selected.id)||[]).some(e=>e.cop===c.id);
      cls+=related?" connected":" dim";
    }
    return `<button class="${cls}" data-type="cop" data-id="${esc(c.id)}" style="left:${p.x}px;top:${p.y}px">
      <div class="net-name">${statusCue(c.status)} ${esc(c.name)}</div>
      <div class="net-count">${n} metrics · ${esc(c.status)}</div>
    </button>`;
  }).join("");
}

function drawCopNetworkEdges(){
  if(state.view!=="flow") return;
  const svg=$("#networkSvg"), stage=$("#networkStage"), sr=stage.getBoundingClientRect();
  let paths=[];
  (DATA.cop_links||[]).forEach(l=>{
    const a=$("#networkNodes").querySelector(`[data-id="${CSS.escape(l.from)}"]`);
    const b=$("#networkNodes").querySelector(`[data-id="${CSS.escape(l.to)}"]`);
    if(!a||!b)return;
    const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
    const x1=ar.left+ar.width/2-sr.left, y1=ar.top+ar.height/2-sr.top;
    const x2=br.left+br.width/2-sr.left, y2=br.top+br.height/2-sr.top;
    const mx=(x1+x2)/2, my=(y1+y2)/2 - Math.min(55,Math.abs(x2-x1)*.10+15);
    const hot=state.selected?.type==="cop"&&(state.selected.id===l.from||state.selected.id===l.to);
    paths.push(`<path class="net-edge${hot?" hot":""}" d="M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}"><title>${esc((copById.get(l.from)?.name||l.from)+" → "+(copById.get(l.to)?.name||l.to)+" · "+(l.kind||""))}</title></path>`);
  });

  svg.innerHTML=paths.join("");
}

const LIVE_STATES = DATA.meta?.metric_states || ["NORMAL","WARNING","EXCEPTION","CRITICAL","UNKNOWN","NOT_APPLICABLE"];
function liveMetricHtml(id){
  if(!liveEnabled()) return "";
  const rows=state.liveMetrics.get(id)||[];
  if(!rows.length) return `<h3>Live metric states</h3><div class="live-box">no data yet</div>`;
  const counts=Object.fromEntries(LIVE_STATES.map(s=>[s,0]));
  rows.forEach(r=>{if(r.state in counts)counts[r.state]+=Number(r.n)||0});
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  const seg=LIVE_STATES.map(s=>`<span class="state-${s.toLowerCase()}" style="width:${total?counts[s]/total*100:0}%" title="${esc(s)}: ${counts[s]}"></span>`).join("");
  return `<h3>Live metric states</h3><div class="live-box"><div class="live-seg">${seg}</div><div class="live-legend">${LIVE_STATES.map(s=>`<div class="live-state"><span>${esc(s)}</span><strong>${counts[s]}</strong></div>`).join("")}</div></div>`;
}
function liveCopHtml(id){
  if(!liveEnabled()) return "";
  const rows=state.liveCops.get(id)||[];
  if(!rows.length) return `<h3>Live decisions</h3><div class="live-box">no data yet</div>`;
  const interpretations=new Map(), actions=new Map();
  rows.forEach(r=>{
    const n=Number(r.n)||0;
    interpretations.set(r.interpretation,(interpretations.get(r.interpretation)||0)+n);
    actions.set(r.action,(actions.get(r.action)||0)+n);
  });
  const table=map=>`<table class="small-table">${[...map.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")}</table>`;
  return `<h3>Live decisions</h3><div class="live-box"><strong>By interpretation</strong>${table(interpretations)}<div style="height:8px"></div><strong>By action</strong>${table(actions)}</div>`;
}
function liveEnabled(){return Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY)}
async function fetchLiveView(name){
  const base=CONFIG.SUPABASE_URL.replace(/\/$/,"");
  const r=await fetch(`${base}/rest/v1/${encodeURIComponent(name)}?select=*`,{
    headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:`Bearer ${CONFIG.SUPABASE_ANON_KEY}`}
  });
  if(!r.ok) throw new Error(`${name}: ${r.status}`);
  return r.json();
}
async function refreshLive(){
  if(!liveEnabled())return;
  try{
    const reads=DATA.live?.reads||{};
    const metricView=Object.keys(reads).find(k=>(reads[k]||[]).includes("metric_id")&&(reads[k]||[]).includes("state"));
    const copView=Object.keys(reads).find(k=>(reads[k]||[]).includes("cop")&&(reads[k]||[]).includes("interpretation"));
    const [mr,cr]=await Promise.all([metricView?fetchLiveView(metricView):Promise.resolve([]),copView?fetchLiveView(copView):Promise.resolve([])]);
    state.liveMetrics=new Map();
    mr.forEach(r=>{if(!state.liveMetrics.has(r.metric_id))state.liveMetrics.set(r.metric_id,[]);state.liveMetrics.get(r.metric_id).push(r)});
    state.liveCops=new Map();
    cr.forEach(r=>{if(!state.liveCops.has(r.cop))state.liveCops.set(r.cop,[]);state.liveCops.get(r.cop).push(r)});
    renderDetail();
  }catch(err){
    console.warn("Live mode refresh failed",err);
  }
}
